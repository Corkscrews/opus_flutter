name: opus_codec_macos
description: macOS implementation of the opus_codec plugin.
repository: https://github.com/Corkscrews/opus_flutter/tree/master/opus_flutter_macos
version: 3.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Rewritten to ^<version> by scripts/prepare_publish.dart when publishing.
  opus_codec_platform_interface:
    path: ../opus_flutter_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: opus_codec
    platforms:
      macos:
        pluginClass: OpusFlutterMacosPlugin
        dartPluginClass: OpusFlutterMacOS
