name: opus_codec_windows
description: Windows implementation of the opus_codec plugin.
repository: https://github.com/Corkscrews/opus_flutter/tree/master/opus_flutter_windows
version: 3.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Rewritten to ^<version> by scripts/prepare_publish.dart when publishing.
  opus_codec_platform_interface:
    path: ../opus_flutter_platform_interface
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/opus_license.txt
    - assets/libopus_x64.dll.blob
    - assets/libopus_x86.dll.blob
  plugin:
    implements: opus_codec
    platforms:
      windows:
        dartPluginClass: OpusFlutterWindows
