name: opus_codec_dart
version: 4.0.0
description: >
  Wraps libopus in dart, and additionally provides a dart friendly API for
  encoding and decoding.
repository: https://github.com/Corkscrews/opus_flutter/tree/master/opus_dart

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5
  wasm_ffi: ^2.1.0

dev_dependencies:
  build_runner: ^2.4.0
  ffigen: ^23.0.0
  lints: ^5.0.0
  mockito: ^5.4.0
  test: ^1.24.0
