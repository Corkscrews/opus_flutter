name: opus_codec_web
description: Web implementation of the opus_codec plugin.
repository: https://github.com/Corkscrews/opus_flutter/tree/master/opus_flutter_web
version: 3.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Rewritten to ^<version> by scripts/prepare_publish.dart when publishing.
  opus_codec_platform_interface:
    path: ../opus_flutter_platform_interface
  wasm_ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/libopus.js
    - assets/libopus.wasm
  plugin:
    implements: opus_codec
    platforms:
      web:
        pluginClass: OpusFlutterWeb
        fileName: opus_flutter_web.dart
