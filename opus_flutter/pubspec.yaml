name: opus_codec
description: Initializes libopus for opus_codec_dart on Flutter platforms. Native platforms use the bundled code asset; web loads the WASM backend.
repository: https://github.com/Corkscrews/opus_flutter/tree/master/opus_flutter
version: 4.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  # Path dependencies are rewritten to ^<version> by
  # scripts/prepare_publish.dart when publishing.
  opus_codec_dart:
    path: ../opus_dart
  opus_codec_platform_interface:
    path: ../opus_flutter_platform_interface
  opus_codec_web:
    path: ../opus_flutter_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  plugin_platform_interface: ^2.1.0

# Native platforms need no plugin: libopus is a code asset built by
# opus_codec_dart's build hook. Only web loads a plugin (the WASM backend).
flutter:
  plugin:
    platforms:
      web:
        default_package: opus_codec_web
